---
name: cross platform install check
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  poetry-install:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"] # "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: python -m pip install "poetry>=2.2"
      - name: Check poetry version
        run: python -m poetry --version
      - name: Install datafaker
        run: python -m poetry install --all-extras
  uv-install:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"] # "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check uv version
        run: uv --version
      - name: Install datafaker
        run: uv sync
  pip-install:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"] # "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install datafaker
        run: python -m pip install .
