---
name: unit test action
on:
  pull_request:
  # Run on merge to main because caches are inherited from parent branches
  push:
    branches:
      - main
env:
  # This should be the default but we'll be explicit
  PYTHON_VERSION: "3.12"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install prerequisites
        id: install-prereqs
        shell: bash
        run: |
          sudo apt install python3-poetry mssql-tools18
        background: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Install poetry into the setup-python interpreter rather than via apt,
      # so it doesn't run on (and build the venv with) the runner's system Python.
      - name: Install poetry
        shell: bash
        run: python -m pip install poetry
      - name: Start PostgreSQL
        shell: bash
        run: |
          sudo systemctl start postgresql.service
      - name: Wait for poetry to be installed
        wait: install-prereqs
      - name: Configure poetry
        shell: bash
        run: python -m poetry config virtualenvs.in-project true
      - name: Install dependencies
        id: install-deps
        shell: bash
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        run: python -m poetry install --all-extras
        background: true
      - name: Set up MS SQL Server
        uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
        with:
          compose-file: ./docker-compose.yml
      - name: Wait for the dependencies
        wait:
          - install-deps
      - name: Run tests
        shell: bash
        run: poetry run python -m pytest -rs
